# Worker de vídeo en un contenedor. Lee las claves de .env.local (nunca se copia a la imagen).
#   podman compose up -d --build     arrancar (o docker compose)
#   podman compose logs -f worker    ver el log
#   podman compose down              parar
# Tras un reinicio vuelve solo: podman-restart (systemd de usuario) + loginctl enable-linger.
services:
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file: .env.local
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    tmpfs:
      - /tmp
