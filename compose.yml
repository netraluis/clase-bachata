# Worker de vídeo en un contenedor. Lee las claves de .env.local (nunca se copia a la imagen).
#   docker compose up -d --build     arrancar (o podman compose)
#   docker compose logs -f worker    ver el log
#   docker compose down              parar
services:
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file: .env.local
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    tmpfs:
      - /tmp
